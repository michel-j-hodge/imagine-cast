<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Imagine Cast</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #cam, #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: cover; background: #000; }
  #cam.mirror { transform: scaleX(-1); }
  #fx { pointer-events: none; }
  #guide { position: fixed; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom));
    text-align: center; pointer-events: none; padding: 0 24px; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  #hint { font-size: 17px; font-weight: 600; letter-spacing: .01em; min-height: 1.3em; }
  #legend { margin-top: 8px; font-size: 14px; line-height: 1.5; color: #f1e6da; min-height: 1.5em; }
  #flip { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 14px; width: 46px; height: 46px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.4); color: #fff;
    font-size: 21px; line-height: 1; display: none; }
  #debug { position: fixed; top: calc(200px + env(safe-area-inset-top)); left: 14px; font: 12px/1.45 ui-monospace, Menlo, monospace;
    background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 6px; white-space: pre; display: none; pointer-events: none; }
  #relay { position: fixed; top: calc(70px + env(safe-area-inset-top)); right: 14px; font: 12px/1.45 ui-monospace, Menlo, monospace;
    background: rgba(0,0,0,.6); padding: 6px 9px; border-radius: 6px; text-align: left; }
  #relayText { margin: 0; white-space: pre; font: inherit; }
  #copyCsv { margin-top: 6px; padding: 5px 10px; font: 12px ui-monospace, Menlo, monospace; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); border-radius: 5px; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: radial-gradient(circle at 50% 42%, #2a1206 0%, #000 65%); text-align: center; padding: 28px; }
  #start h1 { margin: 0; font-size: 30px; font-weight: 700; }
  #start p { margin: 0; max-width: 310px; font-size: 15px; line-height: 1.5; color: #d9c9bd; }
  #start ul { margin: 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.8; color: #f1e6da; text-align: left; }
  #go { margin-top: 8px; padding: 15px 34px; font-size: 17px; font-weight: 700; color: #1a0a00;
    background: linear-gradient(#ffc44d, #ff7a18); border: 0; border-radius: 999px; }
  #go:disabled { opacity: .55; }
  #err { color: #ff9a8a; font-size: 14px; max-width: 310px; min-height: 1.4em; white-space: pre-wrap; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<div id="guide"><div id="hint"></div><div id="legend"></div></div>
<div id="debug"></div>
<button id="flip" aria-label="Switch camera">&#8635;</button>
<div id="relay"><pre id="relayText"></pre><button id="copyCsv">Copy CSV</button></div>

<div id="start">
  <h1>Imagine Cast</h1>
  <p>Make a fist, then two fingers up to arm fire. Hold an open hand for a second to disarm.</p>
  <button id="go">Start camera</button>
  <div id="err"></div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

const WASM_URL  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// ---- Tuning ---------------------------------------------------------------
// Finger ratio = fingertip-to-wrist distance over knuckle-to-wrist distance.
// Roughly 0.9 for a curled finger and 1.9 for a straight one.
const FIST_BELOW   = 1.25;  // average ratio below this = fist
const OPEN_ABOVE   = 1.60;  // average ratio above this = open hand
const EXT          = 1.55;  // a finger counts as extended above this
const EXT_PINKY    = 1.45;  // the pinky is shorter, so its bar is lower
const CURL         = 1.40;  // a finger counts as curled below this
const PINCH_BELOW  = 0.28;  // thumb-to-index gap, in palm lengths, that counts as a pinch
const POSE_FRAMES  = 3;     // frames a pose must hold before it registers
const CHARGE_WINDOW = 1500; // ms allowed between the fist and the sign
const DISARM_HOLD_MS = 1000; // ms an open hand must be held while armed before "none" is sent
const LOST_HOLD    = 500;   // ms a charge survives a tracking dropout (losing the hand never disarms)
const FLAME_HEIGHT = 1.7;   // flame height as a multiple of palm length
const RENDER_SCALE = 1.5;   // canvas pixels per CSS pixel (capped by device)
const ARMED_FLAME  = 0.6;   // steady palm flame while armed, so the tester can see the page's state
// Relay: Firebase Realtime Database over REST. ?db=<url> overrides DB_URL.
const BAND_ID = "band-01";
const DB_URL  = (new URLSearchParams(location.search).get("db")
                 || "https://imagine-cast-default-rtdb.asia-southeast1.firebasedatabase.app").replace(/\/+$/, "");
const ACK_TIMEOUT_MS = 3000; // a send with no matching ack within this time gets a blank round trip
// ---------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const video = $("cam"), canvas = $("fx"), hint = $("hint"), legend = $("legend"), dbg = $("debug");
const DEBUG = new URLSearchParams(location.search).has("debug");
if (DEBUG) dbg.style.display = "block";

// ---------- WebGL effects --------------------------------------------------
const VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FRAG = `
precision highp float;
uniform vec2  uPos;       // palm centre, canvas pixels (origin bottom-left)
uniform float uS;         // palm length, canvas pixels
uniform float uTime;
uniform float uFlame;     // flame intensity
uniform float uFlameK;    // flame height in palm lengths
uniform float uBolt;      // lightning intensity
uniform float uRing;      // spell circle intensity
uniform float uCharge;    // gathering sparks while the fist is held
uniform vec3  uTilt;      // xy = palm normal on screen, z = foreshortening
uniform vec2  uTips[5];   // fingertips, canvas pixels (thumb to pinky)
uniform float uGlow[5];   // glow per fingertip
uniform vec3  uGlowCol;
uniform vec2  uBall;      // ball of light centre, canvas pixels
uniform float uBallR;     // ball radius, canvas pixels
uniform float uBallI;     // ball intensity
uniform vec2  uBallVel;   // travel direction, length 0..1 by speed
uniform float uSquash;    // 1 at the moment of a catch, decays to 0

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
  return v;
}

// Jagged arc from a to b that re-rolls its shape several times a second.
float bolt(vec2 p, vec2 a, vec2 b, float seed) {
  vec2 ab = b - a;
  float L = length(ab);
  if (L < 0.06) return 0.0;
  vec2 d = ab / L;
  vec2 n = vec2(-d.y, d.x);
  float along = dot(p - a, d);
  float u = clamp(along / L, 0.0, 1.0);
  float env = sin(u * 3.14159);
  float tick = floor(uTime * 14.0) + seed;
  float off = (fbm(vec2(u * 4.0 + tick * 1.7, tick)) - 0.5) * 0.55 * L * env
            + (noise(vec2(u * 16.0 + tick * 3.1, seed)) - 0.5) * 0.14 * L * env;
  float dist = abs(dot(p - a, n) - off);
  float ends = smoothstep(-0.04, 0.0, along) * smoothstep(L + 0.04, L, along);
  return 0.012 / (dist + 0.004) * smoothstep(0.5, 0.0, dist) * ends;
}

// Radius of a regular polygon's edge at angle a (corner radius 1).
float poly(float a, float n) {
  float s = 6.28318 / n;
  float k = mod(a, s) - s * 0.5;
  return cos(s * 0.5) / cos(k);
}
float line(float d, float w) {
  float a = abs(d);
  return smoothstep(w, 0.0, a) + 0.35 * exp(-a * 28.0);
}

void main() {
  float glowSum = uGlow[0] + uGlow[1] + uGlow[2] + uGlow[3] + uGlow[4];
  vec2 p = (gl_FragCoord.xy - uPos) / uS;
  float t = uTime;
  vec3 col = vec3(0.0);
  float alpha = 0.0;

  // ---- Ball of light (moves freely, so it is drawn before the palm cut-off) ----
  if (uBallI > 0.003) {
    vec2 q = (gl_FragCoord.xy - uBall) / uBallR;
    q *= vec2(1.0 - 0.22 * uSquash, 1.0 + 0.35 * uSquash);
    float sp = length(uBallVel);
    if (sp > 0.01) {
      vec2 d = uBallVel / sp;
      float al = dot(q, d);
      vec2 perp = q - al * d;
      if (al < 0.0) { al /= (1.0 + 2.5 * sp); perp *= 1.0 + 0.5 * sp * min(-al, 1.5); }
      q = al * d + perp;
    }
    float r = length(q);
    if (r < 7.0) {
      float swirl = fbm(q * 2.2 + vec2(t * 0.9, -t * 0.7));
      float core = exp(-r * r * 3.0);
      float halo = exp(-r * r * 0.32) * (0.85 + 0.15 * noise(vec2(t * 8.0, 2.2)));
      vec3 c = vec3(1.0, 0.97, 0.9) * core * (1.0 + 0.6 * swirl)
             + vec3(1.0, 0.8, 0.4) * halo * 0.38
             + vec3(1.0, 0.9, 0.6) * smoothstep(0.14, 0.0, abs(r - 0.95)) * 0.4 * swirl;
      for (int i = 0; i < 6; i++) {
        float fi = float(i);
        float s = hash(vec2(fi, 8.3));
        float a = t * (1.2 + s) + fi * 1.05;
        vec2 e = (1.35 + 0.4 * sin(t * 1.7 + fi)) * vec2(cos(a), sin(a) * 0.8);
        float de = length(q - e);
        c += vec3(1.0, 0.92, 0.7) * exp(-de * de * 90.0) * 0.7;
      }
      col += c * uBallI;
      alpha = clamp(core * 0.6, 0.0, 1.0) * min(uBallI, 1.0);
    }
  }

  if (uFlame + uBolt + uRing + uCharge + glowSum < 0.003 || dot(p, p) > 30.0) {
    gl_FragColor = vec4(col, alpha);
    return;
  }

  vec2 tp[5];
  for (int i = 0; i < 5; i++) tp[i] = (uTips[i] - uPos) / uS;

  // ---- Flame ----
  if (uFlame > 0.003) {
    vec2 pf = (p - vec2(0.0, 0.12)) / uFlameK;
    float n  = fbm(vec2(pf.x * 3.0, pf.y * 2.2 - t * 1.8));
    float n2 = fbm(vec2(pf.x * 6.0 + 7.3, pf.y * 4.0 - t * 3.0));
    vec2 q = pf;
    q.x += (n - 0.5) * 0.38 * max(q.y, 0.0);
    float y = q.y / (1.0 + (n2 - 0.5) * 0.5);
    float w = 0.32 * sqrt(max(1.0 - y, 0.0)) * smoothstep(-0.12, 0.15, y);
    float d = abs(q.x) / max(w, 0.001);
    float f = smoothstep(1.0, 0.15, d) * step(-0.12, y) * step(y, 1.0);
    f *= mix(1.0, n * 1.7, smoothstep(0.25, 1.0, y));
    f = clamp(f, 0.0, 1.0);

    vec3 c = vec3(1.0, 0.33, 0.05) * f * 1.15
           + vec3(1.0, 0.78, 0.28) * pow(f, 2.5)
           + vec3(1.0, 0.97, 0.9)  * pow(f, 6.0) * 0.6;

    float flick = 0.82 + 0.18 * noise(vec2(t * 9.0, 3.1));
    float r = length((pf - vec2(0.0, 0.2)) * vec2(1.0, 0.85));
    c += vec3(1.0, 0.45, 0.12) * exp(-r * r * 2.2) * 0.36 * flick;

    for (int i = 0; i < 8; i++) {
      float fi = float(i);
      float s = hash(vec2(fi, 1.7));
      float life = fract(t * (0.35 + 0.3 * s) + s * 7.0);
      vec2 e = vec2((s - 0.5) * 0.5 + sin(t * 2.0 + fi * 2.4) * 0.12 * life, 0.3 + life * 1.5);
      float de = length(pf - e);
      c += vec3(1.0, 0.6, 0.2) * exp(-de * de * 1800.0) * (1.0 - life) * 1.2;
    }
    col += c * uFlame;
    alpha = max(alpha, clamp(f * 0.55, 0.0, 1.0) * min(uFlame, 1.0));
  }

  // ---- Charge: sparks spiralling into the fist ----
  if (uCharge > 0.003) {
    vec3 c = vec3(1.0, 0.8, 0.5) * exp(-dot(p, p) * 3.0) * 0.2 * (0.7 + 0.3 * sin(t * 10.0));
    for (int i = 0; i < 10; i++) {
      float fi = float(i);
      float s = hash(vec2(fi, 4.2));
      float life = fract(t * (0.9 + 0.5 * s) + s * 5.0);
      float rad = mix(1.7, 0.25, life * life);
      float a = s * 6.28318 + life * 2.5 + fi;
      float de = length(p - rad * vec2(cos(a), sin(a)));
      c += vec3(1.0, 0.85, 0.6) * exp(-de * de * 700.0) * life * 1.3;
    }
    col += c * uCharge;
  }

  // ---- Fingertip glow ----
  if (glowSum > 0.003) {
    for (int i = 0; i < 5; i++) {
      float d = length(p - tp[i]);
      col += uGlowCol * uGlow[i] * (exp(-d * d * 40.0) * 0.8 + exp(-d * d * 600.0));
    }
  }

  // ---- Lightning between neighbouring fingertips ----
  if (uBolt > 0.003) {
    float b = 0.0;
    for (int i = 0; i < 4; i++) {
      float fi = float(i);
      float on = step(0.3, hash(vec2(floor(t * 8.0), fi * 3.7)));
      b += bolt(p, tp[i], tp[i + 1], fi * 11.3) * on;
    }
    float flick = 0.7 + 0.3 * noise(vec2(t * 14.0, 9.3));
    vec3 c = vec3(0.5, 0.7, 1.0) * b + vec3(1.0) * min(b * b * 0.15, 1.0);
    c += vec3(0.35, 0.55, 1.0) * exp(-dot(p, p) * 1.6) * 0.28 * flick;
    col += c * uBolt;
  }

  // ---- Spell circle, foreshortened to lie on the palm ----
  if (uRing > 0.003) {
    vec2 m = uTilt.xy;
    float ml = length(m);
    m = ml > 0.001 ? m / ml : vec2(1.0, 0.0);
    vec2 q = vec2(dot(p, m) / uTilt.z, dot(p, vec2(-m.y, m.x)));
    q /= (0.35 + 0.65 * min(uRing, 1.0));
    float r = length(q);
    if (r < 1.7) {
      float ang = atan(q.y, q.x);
      float g = line(r - 1.30, 0.012) + line(r - 1.18, 0.008) + line(r - 0.50, 0.008);
      float dash = step(0.5, fract((ang + t * 0.5) * 24.0 / 6.28318));
      g += smoothstep(0.035, 0.0, abs(r - 1.24)) * dash * 0.8;
      g += line(r - 1.12 * poly(ang - t * 0.35, 4.0), 0.010);
      g += line(r - 1.12 * poly(ang - t * 0.35 + 0.7854, 4.0), 0.010);
      g += line(r - 0.86 * poly(ang + t * 0.6, 3.0), 0.010);
      float flick = 0.85 + 0.15 * noise(vec2(t * 7.0, 5.5));
      vec3 c = mix(vec3(0.25, 0.95, 0.85), vec3(0.6, 0.5, 1.0), 0.5 + 0.5 * sin(ang * 2.0 + t));
      col += c * g * flick * min(uRing, 1.0);
      col += vec3(0.2, 0.8, 0.8) * exp(-r * r * 1.2) * 0.12 * uRing;
    }
  }

  gl_FragColor = vec4(col, alpha);
}`;

let gl = null, U = null, glError = "";
const tipsBuf = new Float32Array(10), glowBuf = new Float32Array(5);
try {
  gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) throw new Error("WebGL is not available in this browser.");
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const loc = (n) => gl.getUniformLocation(prog, n);
  U = { pos: loc("uPos"), s: loc("uS"), time: loc("uTime"), flame: loc("uFlame"), flameK: loc("uFlameK"),
        bolt: loc("uBolt"), ring: loc("uRing"), charge: loc("uCharge"), tilt: loc("uTilt"),
        tips: loc("uTips[0]"), glow: loc("uGlow[0]"), glowCol: loc("uGlowCol"),
        ball: loc("uBall"), ballR: loc("uBallR"), ballI: loc("uBallI"), ballVel: loc("uBallVel"), squash: loc("uSquash") };
  gl.clearColor(0, 0, 0, 0);
} catch (e) {
  glError = "Effects failed to load: " + (e && e.message ? e.message : e);
  $("err").textContent = glError;
}

let pxScale = 1;
function resize() {
  pxScale = Math.min(window.devicePixelRatio || 1, RENDER_SCALE);
  canvas.width  = Math.round(window.innerWidth  * pxScale);
  canvas.height = Math.round(window.innerHeight * pxScale);
  if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();

// ---------- Smoothing (One Euro filter) ------------------------------------
class OneEuro {
  constructor(minCut = 1.5, beta = 0.02, dCut = 1.0) { this.minCut = minCut; this.beta = beta; this.dCut = dCut; this.t = null; }
  reset() { this.t = null; }
  filter(x, t) {
    if (this.t === null) { this.t = t; this.x = x; this.dx = 0; return x; }
    const dt = Math.max((t - this.t) / 1000, 1e-3); this.t = t;
    const alpha = (cut) => { const r = 2 * Math.PI * cut * dt; return r / (r + 1); };
    this.dx += alpha(this.dCut) * ((x - this.x) / dt - this.dx);
    this.x  += alpha(this.minCut + this.beta * Math.abs(this.dx)) * (x - this.x);
    return this.x;
  }
}
const fx = new OneEuro(), fy = new OneEuro(), fs = new OneEuro(1.0, 0.005);

// ---------- Hand maths -----------------------------------------------------
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

// Classify the hand into one pose from its 3D landmarks.
function readPose(w) {
  const wrist = w[0];
  const ratio = (mcp, tip) => dist3(w[tip], wrist) / Math.max(dist3(w[mcp], wrist), 1e-4);
  const ri = ratio(5, 8), rm = ratio(9, 12), rr = ratio(13, 16), rp = ratio(17, 20);
  const avg = (ri + rm + rr + rp) / 4;
  const pinch = dist3(w[4], w[8]) / Math.max(dist3(w[9], wrist), 1e-4);
  let pose = "none";
  if (ri > EXT && rm < CURL && rr < CURL && rp < CURL) pose = "one";
  else if (avg < FIST_BELOW) pose = "fist";
  else if (pinch < PINCH_BELOW && rm > EXT && rr > EXT) pose = "pinch";
  else if (ri > EXT && rm > EXT && rr < CURL && rp < CURL) pose = "two";
  else if (ri > EXT && rp > EXT_PINKY && rm < CURL && rr < CURL) pose = "horns";
  else if (avg > OPEN_ABOVE && pinch > 0.45 && ri > EXT && rm > EXT && rr > 1.4 && rp > 1.3) pose = "open";
  return { pose, ri, rm, rr, rp, pinch };
}

// Normalised video coordinates -> CSS pixels, accounting for object-fit: cover.
let mirrored = false;
function toScreen(lm) {
  const W = window.innerWidth, H = window.innerHeight;
  const vw = video.videoWidth || W, vh = video.videoHeight || H;
  const s = Math.max(W / vw, H / vh);
  let x = (W - vw * s) / 2 + lm.x * vw * s;
  const y = (H - vh * s) / 2 + lm.y * vh * s;
  if (mirrored) x = W - x;
  return { x, y };
}

// ---------- State ----------------------------------------------------------
let state = "idle";            // idle -> charging (fist) -> back to idle; two fingers in time sends "fire"
let armed = false;             // The page's view only, for display and the disarm rule. The watch is the source of truth.
let cand = "none", candCount = 0, stable = "none";
let chargeAt = 0, castAt = 0, lastSeen = 0, openSince = 0;
let handVisible = false, flare = 0;
let iFlame = 0, iCharge = 0;
let pos = { x: 0, y: 0 }, size = 100;
let lastRead = null;

function updateState(now) {
  if (state === "idle") {
    if (stable === "fist") { state = "charging"; chargeAt = now; }
  } else if (state === "charging") {
    if (stable === "two" && now - chargeAt <= CHARGE_WINDOW) {
      // Arming again while already armed is allowed: new seq, the watch buzzes again.
      armed = true; sendState("fire");
      state = "idle"; castAt = now; flare = 1;
    }
    else if (stable === "fist") chargeAt = now;
    else if (now - chargeAt > CHARGE_WINDOW) state = "idle";
  }
  // Disarm: a stable open hand held for DISARM_HOLD_MS while armed. Shorter opens send nothing.
  if (stable === "open") {
    if (!openSince) openSince = now;
    if (armed && now - openSince >= DISARM_HOLD_MS) { armed = false; sendState("none"); }
  } else openSince = 0;
}

function setGuide(now) {
  let text = "";
  if (!handVisible) text = armed ? "Fire armed" : "Show your hand to the camera";
  else if (state === "charging") text = "Now two fingers up";
  else if (armed && openSince) text = "Keep your hand open to disarm…";
  else if (armed) text = now - castAt < 3500 ? "Fire armed. Punch!" : "Fire armed";
  else text = "Make a fist";
  if (hint.textContent !== text) hint.textContent = text;
  if (legend.textContent !== "") legend.textContent = "";
}

// ---------- Relay (Firebase RTDB over REST, no SDK) ------------------------
// Writes: fetch PUT of the whole state object. Reads: EventSource on the ack path.
const STATE_URL = `${DB_URL}/bands/${BAND_ID}/state.json`;
const ACK_URL   = `${DB_URL}/bands/${BAND_ID}/ack.json`;
const rows = [];               // one per send: { seq, power, writeMs, rttMs, warm, err, t0 }
let lastSeq = 0;
let ackStatus = "connecting";  // live | connecting | error
let writeError = "";
let ackSource = null, ackSnapshotSeen = false, relayStarted = false;
const relayText = $("relayText");

async function sendState(power, warm = false) {
  // seq is wall-clock time, never a counter: a counter resets when the page reloads,
  // and the watch would then ignore every new event as old.
  const seq = Math.max(Date.now(), lastSeq + 1);
  lastSeq = seq;
  const row = { seq, power, writeMs: null, rttMs: null, warm, err: "", t0: performance.now() };
  rows.push(row);
  renderRelay();
  setTimeout(renderRelay, ACK_TIMEOUT_MS + 50);
  try {
    // sentAt is informational only. Never compare clocks across devices.
    const res = await fetch(STATE_URL, { method: "PUT", body: JSON.stringify({ power, seq, sentAt: Date.now() }) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    row.writeMs = Math.round(performance.now() - row.t0);
    writeError = "";
  } catch (e) {
    row.err = e && e.message ? e.message : String(e);
    writeError = row.err;
  }
  renderRelay();
}

function onAck(seq) {
  const row = rows.find((r) => r.seq === seq);
  if (!row || row.rttMs !== null) return;
  const rtt = performance.now() - row.t0;
  if (rtt <= ACK_TIMEOUT_MS) row.rttMs = Math.round(rtt);
  renderRelay();
}

function openAck() {
  if (ackSource) ackSource.close();
  ackStatus = "connecting"; renderRelay();
  const es = new EventSource(ACK_URL);
  ackSource = es;
  // Every (re)connect starts with a snapshot of whatever ack is already stored. It is not a reply to a send.
  es.onopen = () => { ackSnapshotSeen = false; ackStatus = "live"; renderRelay(); };
  es.onerror = () => {
    if (es.readyState === EventSource.CLOSED) { ackStatus = "error"; setTimeout(openAck, 2000); }
    else ackStatus = "connecting";
    renderRelay();
  };
  const handle = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (ev.type === "put" && !ackSnapshotSeen) { ackSnapshotSeen = true; return; }
    if (!msg) return;
    const d = msg.data;
    if (msg.path === "/" && d && typeof d.seq === "number") onAck(d.seq);
    else if (msg.path === "/seq" && typeof d === "number") onAck(d);   // console edit of just the seq field
  };
  es.addEventListener("put", handle);
  es.addEventListener("patch", handle);
  const restart = () => { es.close(); ackStatus = "error"; renderRelay(); setTimeout(openAck, 2000); };
  es.addEventListener("cancel", restart);
  es.addEventListener("auth_revoked", restart);
}

function startRelay() {
  if (relayStarted) return;
  relayStarted = true;
  openAck();
  // Warm-up write: opens the TLS connection early so the first real cast is not the slow one.
  sendState("none", true);
}

function renderRelay() {
  let status = ackStatus === "live" ? "● live" : ackStatus === "connecting" ? "○ connecting" : "✕ error";
  if (writeError) status = "✕ error (write: " + writeError + ")";
  let last = "—";
  const r = rows[rows.length - 1];
  if (r) {
    const w = r.writeMs !== null ? `write ${r.writeMs} ms` : r.err ? "write failed" : "write …";
    const waiting = performance.now() - r.t0 <= ACK_TIMEOUT_MS;
    const rt = r.rttMs !== null ? `round trip ${r.rttMs} ms` : waiting ? "round trip …" : "round trip —";
    last = `${w} · ${rt}${r.warm ? " (warm-up)" : ""}`;
  }
  const rtts = rows.filter((x) => !x.warm && x.rttMs !== null).map((x) => x.rttMs).sort((a, b) => a - b);
  const n = rtts.length;
  const med = n ? (n % 2 ? rtts[(n - 1) / 2] : Math.round((rtts[n / 2 - 1] + rtts[n / 2]) / 2)) : null;
  const stats = n ? `median ${med} ms · max ${rtts[n - 1]} ms` : "median — · max —";
  relayText.textContent = `relay   ${status}\narmed   ${armed ? "yes" : "no"}\nlast    ${last}\n${("n=" + n).padEnd(8)}${stats}`;
}

function csv() {
  const q = (s) => /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  const lines = ["seq,power,writeMs,rttMs,note"];
  for (const r of rows) {
    const note = [r.warm ? "warm-up" : "", r.err ? "write failed: " + r.err : ""].filter(Boolean).join("; ");
    lines.push([r.seq, r.power, r.writeMs ?? "", r.rttMs ?? "", q(note)].join(","));
  }
  return lines.join("\n") + "\n";
}

$("copyCsv").addEventListener("click", async () => {
  const btn = $("copyCsv"), text = csv();
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  btn.textContent = `Copied ${rows.length} rows`;
  setTimeout(() => { btn.textContent = "Copy CSV"; }, 1500);
});
renderRelay();

// ---------- Main loop ------------------------------------------------------
let landmarker = null, lastVideoTime = -1, lastFrame = performance.now();
let fps = 0, detectCount = 0, fpsStamp = performance.now();
const ease = (cur, target, dt, rate) => cur + (target - cur) * (1 - Math.exp(-dt * rate));

function frame() {
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;

  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    detectCount++;
    if (res.landmarks && res.landmarks.length) {
      const lm = res.landmarks[0];
      const world = (res.worldLandmarks && res.worldLandmarks[0]) || lm;
      const fresh = !handVisible;
      if (fresh) { fx.reset(); fy.reset(); fs.reset(); }
      handVisible = true; lastSeen = now;

      // Palm centre: wrist plus the four finger knuckles.
      let cx = 0, cy = 0;
      for (const i of [0, 5, 9, 13, 17]) { const p = toScreen(lm[i]); cx += p.x; cy += p.y; }
      cx /= 5; cy /= 5;
      const wrist = toScreen(lm[0]), mid = toScreen(lm[9]), idx = toScreen(lm[5]), pinky = toScreen(lm[17]);
      const palm = Math.max(Math.hypot(mid.x - wrist.x, mid.y - wrist.y),
                            Math.hypot(idx.x - pinky.x, idx.y - pinky.y) * 1.3);
      pos.x = fx.filter(cx, now);
      pos.y = fy.filter(cy, now);
      size  = fs.filter(palm, now);

      // Pose, held for a few frames before it counts.
      lastRead = readPose(world);
      if (lastRead.pose === cand) candCount++; else { cand = lastRead.pose; candCount = 1; }
      if (candCount >= POSE_FRAMES) stable = cand;
      updateState(now);
    } else {
      handVisible = false; cand = "none"; candCount = 0; stable = "none"; openSince = 0;
    }
  }

  // Hand gone for too long: drop a charge in progress. Losing the hand never disarms.
  if (!handVisible && now - lastSeen > LOST_HOLD && state !== "idle") state = "idle";

  // Ease every effect toward its target.
  iFlame  = ease(iFlame,  armed && handVisible ? ARMED_FLAME : 0, dt, armed ? 7 : 11);
  iCharge = ease(iCharge, state === "charging" ? 1 : 0, dt, 8);
  flare *= Math.exp(-dt * 5);

  if (gl) {
    const H = canvas.height;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.pos, pos.x * pxScale, H - pos.y * pxScale);
    gl.uniform1f(U.s, Math.max(size * pxScale, 1));
    gl.uniform1f(U.time, (now / 1000) % 1000);
    gl.uniform1f(U.flame, Math.min(iFlame * (1 + 0.4 * flare), 1.4));
    gl.uniform1f(U.flameK, FLAME_HEIGHT * (0.25 + 0.75 * iFlame) * (1 + 0.55 * flare));
    gl.uniform1f(U.charge, iCharge);
    // Unused effects (lightning, spell circle, fingertip glow, ball of light) stay at 0.
    gl.uniform1f(U.bolt, 0);
    gl.uniform1f(U.ring, 0);
    gl.uniform3f(U.tilt, 0, 0, 0);
    gl.uniform2fv(U.tips, tipsBuf);
    gl.uniform1fv(U.glow, glowBuf);
    gl.uniform3f(U.glowCol, 0, 0, 0);
    gl.uniform2f(U.ball, 0, 0);
    gl.uniform1f(U.ballR, 0);
    gl.uniform1f(U.ballI, 0);
    gl.uniform2f(U.ballVel, 0, 0);
    gl.uniform1f(U.squash, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  setGuide(now);
  if (DEBUG) {
    if (now - fpsStamp > 1000) { fps = detectCount; detectCount = 0; fpsStamp = now; }
    const r = lastRead;
    dbg.textContent = `state  ${state}\narmed  ${armed ? "yes" : "no"}\npose   ${stable} (raw ${cand})\n`
      + (r ? `i ${r.ri.toFixed(2)}  m ${r.rm.toFixed(2)}\nr ${r.rr.toFixed(2)}  p ${r.rp.toFixed(2)}\npinch  ${r.pinch.toFixed(2)}\n` : "")
      + `open   ${openSince ? Math.round(now - openSince) + " ms" : "-"}\n`
      + `hand   ${handVisible ? "yes" : "no"}\ntrack  ${fps} fps\nvideo  ${video.videoWidth}x${video.videoHeight}`;
  }
  requestAnimationFrame(frame);
}

// ---------- Camera and startup ---------------------------------------------
let facing = "environment", stream = null;

async function startCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  mirrored = facing === "user";
  video.classList.toggle("mirror", mirrored);
  video.srcObject = stream;
  await video.play();
  lastVideoTime = -1;
}

async function loadTracker() {
  const vision = await FilesetResolver.forVisionTasks(WASM_URL);
  const make = (delegate) => HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: "VIDEO",
    numHands: 1,
  });
  try { return await make("GPU"); } catch (e) { return await make("CPU"); }
}

$("go").addEventListener("click", async () => {
  const go = $("go"), err = $("err");
  err.textContent = glError;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    err.textContent = "Camera not available. Open this page over https in Chrome.";
    return;
  }
  go.disabled = true; go.textContent = "Starting…";
  startRelay();
  try {
    await startCamera();
    go.textContent = "Loading hand tracker…";
    landmarker = await loadTracker();
    $("start").style.display = "none";
    $("flip").style.display = "block";
    try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
    requestAnimationFrame(frame);
  } catch (e) {
    go.disabled = false; go.textContent = "Start camera";
    err.textContent = e && e.name === "NotAllowedError"
      ? "Camera permission was denied. Allow it in the browser's site settings and try again."
      : "Could not start: " + (e && e.message ? e.message : e);
  }
});

$("flip").addEventListener("click", async () => {
  facing = facing === "environment" ? "user" : "environment";
  try { await startCamera(); } catch (e) { facing = facing === "environment" ? "user" : "environment"; }
});
</script>
